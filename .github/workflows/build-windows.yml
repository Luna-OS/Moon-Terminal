name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create/update the GitHub Release with this build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Determine publish mode
        id: publish
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" || "${{ github.event_name == 'workflow_dispatch' && inputs.publish }}" == "true" ]]; then
            echo "mode=always" >> "$GITHUB_OUTPUT"
          else
            echo "mode=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and optionally publish a GitHub Release)
        shell: bash
        run: |
          if [ "${{ steps.publish.outputs.mode }}" = "always" ]; then
            npm run dist:publish
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: ${{ steps.publish.outputs.mode != 'always' }}
        uses: actions/upload-artifact@v4
        with:
          name: moon-terminal-windows
          path: |
            app/dist/*.exe
